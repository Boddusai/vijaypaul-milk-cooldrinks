  <path d="M113 77l27-23" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M56 91l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#ffe28a"/>
  <path d="M190 72l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#ffe28a"/>
  <circle cx="188" cy="191" r="5" fill="#b5e9a1"/><circle cx="58" cy="179" r="4" fill="#b5e9a1"/>
