<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Milk bottle, leaf and cool drink icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b7a58"/><stop offset="1" stop-color="#064b39"/></linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dff6ee"/></linearGradient>
    <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36d"/><stop offset="1" stop-color="#ff9f43"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#003b2b" flood-opacity=".22"/></filter>
  </defs>
  <circle cx="120" cy="120" r="116" fill="#e9f8f0"/>
  <circle cx="120" cy="120" r="101" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>
