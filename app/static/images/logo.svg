    <rect x="76" y="58" width="28" height="16" rx="4" fill="#f7fffb" stroke="#d7f2e8" stroke-width="3"/>
    <path d="M68 119h46v34c0 7-6 13-13 13H81c-7 0-13-6-13-13z" fill="#a8dcf4"/>
    <path d="M68 127c12-7 31 7 46 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M78 104h24" stroke="#c0e9db" stroke-width="3" stroke-linecap="round"/>
