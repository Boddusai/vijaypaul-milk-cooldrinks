{%extends 'base.html'%}{%block title%}Track Orders{%endblock%}{%block content%}<section class="wrap page"><small class=eyebrow>ORDER TRACKING</small><h1>Find your orders</h1><form class=track><input name=phone value="{{phone}}" placeholder="10-digit mobile number" required><button class="btn primary">Search orders</button></form>{%for o in orders%}<a class=trackrow href="/order/{{o.order_no}}"><b>{{o.order_no}}<small>{{o.created}}</small></b><span>{{o.status}}</span><strong>₹{{'%.0f'|format(o.total)}}</strong></a>{%else%}{%if phone%}<div class=empty>No orders found.</div>{%endif%}{%endfor%}</section>{%endblock%}
