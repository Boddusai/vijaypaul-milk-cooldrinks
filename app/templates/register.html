{%extends 'base.html'%}{%block title%}Create account · Vijaypaul{%endblock%}{%block content%}<section class="auth wrap"><div class="auth-card"><div class="auth-icon">🛍️</div><h1>Create your customer account</h1><p>Save your details and see your orders from one dashboard.</p><form method="post"><label>Full name<input name="name" required placeholder="Your name"></label><label>Mobile number<input name="phone" required pattern="[0-9]{10}" placeholder="10-digit mobile"></label><label>Email<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required minlength="6" placeholder="Minimum 6 characters"></label><button class="btn primary full">Create account</button></form><div class="auth-links"><span>Already registered?</span><a href="/login">Login</a></div></div></section>{%endblock%}
